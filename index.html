<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>License to live with me 💕</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin:0; padding:0; }

body {
  font-family:'Poppins', sans-serif;
  min-height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 20%, #ffd6ec, transparent 40%),
    radial-gradient(circle at 80% 30%, #e4c1ff, transparent 40%),
    linear-gradient(135deg,#ffe6f4,#f6dcff,#ffe6f0);
}

/* Layout */
.container {
  position:relative;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  z-index:2;
}

/* Premium Glossy Glass Card */
.glass-card {
  width:420px;
  max-width:95vw;
  padding:clamp(28px,4vw,45px);
  border-radius:34px;
  backdrop-filter: blur(30px);
  background:
    linear-gradient(145deg, rgba(255,255,255,0.55), rgba(255,255,255,0.18));
  border:1px solid rgba(255,255,255,0.4);
  box-shadow:
    0 25px 70px rgba(255,105,180,0.28),
    inset 0 0 35px rgba(255,255,255,0.35);
  text-align:center;
  animation: floatIn 1.6s ease;
}

@keyframes floatIn {
  from { opacity:0; transform: translateY(60px) scale(.94);} 
  to { opacity:1; transform: translateY(0) scale(1);} 
}

h1 {
  font-family:'Great Vibes', cursive;
  font-size:clamp(34px,6vw,50px);
  margin-bottom:28px;
  color:#ff4fa3;
  text-shadow:0 0 25px rgba(255,100,180,0.7);
}

.question {
  font-size:clamp(18px,3.2vw,22px);
  margin-bottom:25px;
  font-weight:500;
  color:#5a295a;
}

/* Premium Glossy Buttons */
.option {
  width:100%;
  margin:12px 0;
  padding:16px;
  border:none;
  border-radius:22px;
  font-size:16px;
  cursor:pointer;
  color:#6b2b6b;
  backdrop-filter: blur(12px);
  background:
    linear-gradient(145deg, rgba(255,255,255,0.85), rgba(255,255,255,0.35));
  box-shadow:
    0 12px 28px rgba(255,105,180,0.18),
    inset 0 2px 6px rgba(255,255,255,0.8);
  transition: all .35s ease;
}

.option:hover {
  transform: translateY(-4px) scale(1.04);
  box-shadow:
    0 20px 40px rgba(255,105,180,0.35),
    inset 0 2px 10px rgba(255,255,255,0.9);
}

.option:active {
  transform: scale(.96);
}

/* Intro Screen */
.intro-screen {
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
  z-index:6;
}

.intro-box {
  max-width:500px;
  width:100%;
}

.intro-title {
  font-family:'Great Vibes', cursive;
  font-size:clamp(44px,8vw,70px);
  color:#ff4fa3;
  margin-bottom:25px;
}

.intro-sub {
  font-size:clamp(18px,3vw,22px);
  margin-bottom:30px;
  color:#6b2b6b;
}

.start-btn {
  padding:18px 34px;
  border:none;
  border-radius:30px;
  font-size:18px;
  cursor:pointer;
  color:white;
  background: linear-gradient(120deg,#ff6ec4,#ff4fa3,#ff9bd3);
  box-shadow:0 15px 35px rgba(255,105,180,0.45);
  transition:.35s ease;
}

.start-btn:hover {
  transform: translateY(-3px) scale(1.05);
}

.popup {
  position:fixed;
  top:60px;
  left:50%;
  transform:translateX(-50%);
  padding:18px 28px;
  border-radius:22px;
  backdrop-filter: blur(20px);
  background: rgba(255,255,255,0.7);
  box-shadow: 0 15px 40px rgba(255,105,180,0.3);
  font-size:18px;
  z-index:5;
  animation: popupAnim 2.8s ease;
}

@keyframes popupAnim {
  0% { opacity:0; transform:translate(-50%,-80px);} 
  30% { opacity:1; transform:translate(-50%,0);} 
  70% { opacity:1; }
  100% { opacity:0; transform:translate(-50%,-40px);} 
}

/* Ending */
.ending {
  position:fixed;
  inset:0;
  background: linear-gradient(160deg,#ffd6f0,#e8c9ff,#ffd6ec);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px;
  animation: fadeIn 2s ease;
  z-index:4;
}

.ending h2 {
  font-family:'Great Vibes', cursive;
  font-size:clamp(42px,7vw,64px);
  color:#ff4fa3;
  margin-bottom:20px;
}

.ending p {
  font-size:clamp(18px,3vw,22px);
  max-width:600px;
  color:#6b2b6b;
}

.ending-popup {
  margin-top:30px;
  padding:16px 26px;
  border-radius:20px;
  background: rgba(255,255,255,0.7);
  box-shadow:0 10px 30px rgba(255,105,180,0.25);
  font-size:20px;
  animation: endingPop 1.5s ease;
}

@keyframes endingPop {
  from { opacity:0; transform:translateY(-30px);} 
  to { opacity:1; transform:translateY(0);} 
}

/* Hearts */
.heart {
  position:fixed;
  font-size:22px;
  animation: heartFall linear forwards;
  pointer-events:none;
  z-index:1;
}

@keyframes heartFall {
  from { transform: translateY(-10vh);} 
  to { transform: translateY(110vh);} 
}

/* Sparkle Trail */
.sparkle {
  position:fixed;
  pointer-events:none;
  font-size:14px;
  animation: sparkleFade 1s ease forwards;
  z-index:4;
}

@keyframes sparkleFade {
  from { opacity:1; transform: scale(1);} 
  to { opacity:0; transform: scale(0.3);} 
}

</style>
</head>

<body>

<!-- Intro Screen -->
<div class="intro-screen" id="intro">
  <div class="intro-box glass-card">
    <div class="intro-title">Hey You 💕</div>
    <div class="intro-sub">Are you ready for something special?</div>
    <button class="start-btn" onclick="startQuiz()">Yes I'm Ready ✨</button>
  </div>
</div>

<div class="container">
  <div class="glass-card" id="card" style="display:none">
    <h1>License to live with me 💕</h1>
    <div class="question" id="question"></div>
    <div id="options"></div>
  </div>
</div>

<script>

const questions = [
  {
    q: "When did we first met ?",
    options: ["7th August 26","8th August 25","9th August 25","7th August 25"],
    correct: 3
  },
  {
    q: "What did I save your name in my phone ?",
    options: ["Sindhu","Sindumathy shanmugakani","sindhumathi shanmugakani","sindumathi S"],
    correct: 2
  },
  {
    q: "What is your preferred honeymoon location ?",
    options: ["Kerala","Manali","Shimla","Bali"],
    correct: -1
  },
  {
    q: "Will you be my forever valentine ?",
    options: ["Yes !!","No"],
    correct: 0
  }
];

let index = 0;
let noBtn;
let interval;

function startQuiz(){
  document.getElementById("intro").style.display="none";
  document.getElementById("card").style.display="block";
  showQuestion();
}

function showQuestion() {
  const q = questions[index];
  document.getElementById("question").innerText = q.q;

  const optDiv = document.getElementById("options");
  optDiv.innerHTML = "";

  q.options.forEach((opt,i)=>{
    const btn = document.createElement("button");
    btn.className = "option";
    btn.innerText = opt;

    if(index===3 && i===1){
      noBtn = btn;
      startNoAnimation();
    }

    btn.onclick = ()=>handleAnswer(i);
    optDiv.appendChild(btn);
  });
}

function popup(text){
  const p = document.createElement("div");
  p.className = "popup";
  p.innerText = text;
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),2800);
}

function hearts(count=14){
  for(let i=0;i<count;i++){
    const h=document.createElement("div");
    h.className="heart";
    h.innerText=Math.random()>0.5?"💖":"💗";
    h.style.left=Math.random()*100+"vw";
    h.style.animationDuration=(6+Math.random()*6)+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),13000);
  }
}

function startBackgroundHearts(){
  setInterval(()=>hearts(6),1800);
}

startBackgroundHearts();

/* Sparkle Trail */
document.addEventListener("mousemove", e => {
  const s = document.createElement("div");
  s.className = "sparkle";
  s.innerText = "✨";
  s.style.left = e.clientX + "px";
  s.style.top = e.clientY + "px";
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),1000);
});

function handleAnswer(i){

  if(index===0){
    if(i===1){
      popup("Cheers !!!");
      hearts();
      setTimeout(next,1000);
    } else {
      popup("You already forgot ?? 😢");
    }
    return;
  }

  if(index===1){
    if(i===2){
      popup("Bravo !!! 👏");
      hearts();
      setTimeout(next,1000);
    } else {
      popup("Are you sure ??? 😅");
    }
    return;
  }

  if(index===2){
    popup("COIMBATORE ??? I'm so touched dear 😂🤣");
    setTimeout(()=>popup("Well Noted Ma 👍"),3000);
    hearts();
    setTimeout(next,3000);
    return;
  }

  if(index===3){
    if(i===0){
      clearInterval(interval);
      showEnding("Yay !! you earned the license to live with me 💕");
    }
    return;
  }
}

function startNoAnimation(){
  const texts=[
    "Seriously ? You are thinking about it ?",
    "Don't do it ! Don't",
    "Hell with you"
  ];

  let t=0;

  interval=setInterval(()=>{
    if(noBtn){
      noBtn.style.position="fixed";
      noBtn.style.left=(Math.random()*80+10)+"vw";
      noBtn.style.top=(Math.random()*80+10)+"vh";
      noBtn.style.transform="scale(0.85)";
      noBtn.style.zIndex="6";
    }
    popup(texts[t%texts.length]);
    t++;
  },3000);
}

function next(){
  index++;
  showQuestion();
}

function showEnding(message){
  document.body.innerHTML=`
  <div class="ending">
    <h2>Forever Starts Now 💍</h2>
    <p>
      You just signed the lifetime contract of love, laughter and unlimited drama with me.
      No cancellations allowed. Only upgrades — more love, more hugs, more memories.
      <br><br>
      Welcome to your permanent position… right in my heart 💖
      
    </p>
    <div class="ending-popup">${message}</div>
    <p>
      <br><br>
      Special Note : Go to XXXXXX & answer their questions. You will be rewarded
    </p>
  </div>`;

  startBackgroundHearts();
  hearts(20);
}

</script>

</body>
</html>
